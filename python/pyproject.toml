[project]
name = "lab-async-calls-python"
version = "0.1.0"
description = "Python-половина лабы к посту «Кто открыл и не закрыл»"
requires-python = ">=3.14"
dependencies = [
    "httpx==0.28.1",
    "requests==2.34.2",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
